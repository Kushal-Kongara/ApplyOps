[project]
name = "applyops"
version = "0.1.0"
description = "Local-first job discovery and application preparation system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<0.29",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
